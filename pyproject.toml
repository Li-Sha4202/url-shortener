[project]
name = "url-shortener"
version = "0.1.0"
description = "no-description"
authors = [
    {name = "liSha4202",email = "dr.aleksandr-sirotin@yandex.ru"}
]
license = "no-licence"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy[asyncio] (>=2.1.3,<3.0.0)",
    "aiohttp (>=3.14.4,<4.0.0)",
    "alembic[sqlalchemy] (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pytest-mock (>=3.16.0,<4.0.0)",
    "user-agents (>=2.2.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
